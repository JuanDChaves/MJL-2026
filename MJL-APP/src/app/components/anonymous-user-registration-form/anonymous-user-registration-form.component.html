<ion-header class="modal-header">
  <ion-toolbar>
    <ion-title class="header-title">Ingreso Rápido</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="cancelar()" class="close-btn">
        Cerrar
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="registration-content">
  <div class="registration-container">
    <div class="profile-photo-section fade-in-up" style="--delay: 0s">
      <div class="photo-container" (click)="onSelectPhoto()">
        <div class="photo-wrapper">
          @if (viewProfilePhoto()) {
            <img
              [src]="viewProfilePhoto()"
              alt="Foto de perfil"
              class="profile-photo"
            />
            <div class="photo-overlay">
              <ion-icon name="camera" class="camera-icon"></ion-icon>
            </div>
          } @else {
            <div class="photo-placeholder">
              <ion-icon name="camera" class="placeholder-icon"></ion-icon>
              <span class="photo-hint">Foto</span>
            </div>
          }
        </div>
      </div>
    </div>

    <form
      [formGroup]="formModal"
      (ngSubmit)="onSubmit()"
      class="registration-form"
    >
      <ion-list class="fields-list">
        <div class="field-wrapper">
          <ion-item class="field-item">
            <ion-icon name="person" slot="start" class="field-icon"></ion-icon>
            <ion-input
              formControlName="nombres"
              type="text"
              label="Nombres"
              labelPlacement="floating"
              autocomplete="given-name"
              enterkeyhint="next"
              placeholder="Ingrese sus nombres"
              class="field-input"
            ></ion-input>
          </ion-item>
          @if (
            f["nombres"].touched && (f["nombres"] | errorMessage: "nombres")
          ) {
            <ion-text color="danger" class="field-error">
              {{ f["nombres"] | errorMessage: "nombres" }}
            </ion-text>
          }
        </div>
      </ion-list>

      @if (errorMessage) {
        <ion-text color="danger" class="global-error">
          {{ errorMessage }}
        </ion-text>
      }

      <ion-button
        type="submit"
        expand="block"
        [disabled]="isSubmitting()"
        class="submit-button"
      >
        @if (isSubmitting()) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          <ion-icon slot="start" name="flash"></ion-icon>
          <span>Ingresar</span>
        }
      </ion-button>
    </form>
  </div>
</ion-content>
