<div class="home-cantinero-container">
  <!-- Header del cantinero -->
  <div class="home-header">
    <h1 class="home-title">Panel de cantineros</h1>
  </div>

  <div class="main-container">
    <!-- Logo / Avatar -->
    <div class="logo-wrapper">
      <div class="logo-circle">
        <span class="logo-emoji">🍺</span>
      </div>
    </div>

    <!-- Buttons -->
    <div class="buttons-container">

      <ion-button expand="block" class="menu-btn" (click)="agregarPlato()">
        <ion-icon slot="start" name="add-circle-outline"></ion-icon>
        <span>Agregar Nueva Bebida</span>
      </ion-button>

      <ion-button expand="block" class="menu-btn" (click)="prepararPedidos()">
        <ion-icon slot="start" name="checkmark-circle-outline"></ion-icon>
        <span>Preparar Pedido</span>
      </ion-button>
    </div>
  </div>
</div>
