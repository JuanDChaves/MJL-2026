<div class="home-cocinero-container">
  <!-- Header del cocinero -->
  <div class="home-header">
    <h1 class="home-title">Panel de cocineros</h1>
  </div>

  <div class="main-container">
    <!-- Logo / Avatar -->
    <div class="logo-wrapper">
      <div class="logo-circle">
        <span class="logo-emoji">👨‍🍳</span>
      </div>
    </div>

    <!-- Buttons -->
    <div class="buttons-container">

      <ion-button expand="block" class="menu-btn" (click)="agregarPlato()">
        <ion-icon slot="start" name="add-circle-outline"></ion-icon>
        <span>Agregar Nuevo Plato</span>
      </ion-button>

      <ion-button expand="block" class="menu-btn" (click)="verificarPedido()">
        <ion-icon slot="start" name="checkmark-circle-outline"></ion-icon>
        <span>Verificar Pedido</span>
      </ion-button>

      <ion-button expand="block" class="menu-btn" (click)="entregarPedido()">
        <ion-icon slot="start" name="bicycle-outline"></ion-icon>
        <span>Entregar Pedido</span>
      </ion-button>

    </div>
  </div>
</div>
