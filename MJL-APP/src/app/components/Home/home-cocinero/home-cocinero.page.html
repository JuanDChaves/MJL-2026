<div class="home-cocinero-container">
  <!-- Header del cocinero -->
  <div class="home-header">
    <h1 class="home-title">Bienvenido a nuestra aplicacion para cocineros</h1>
  </div>

  <div class="main-container">
    <!-- Logo / Avatar -->
    <div class="logo-wrapper">
      <div class="logo-circle">
        <span class="logo-emoji">👨‍🍳</span>
      </div>
    </div>

    <!-- Buttons -->
    <div class="buttons-container">

      <button class="menu-btn" (click)="agregarPlato()">
        <ion-icon name="add-circle-outline"></ion-icon>
        <span>Agregar Nuevo Plato</span>
      </button>

      <button class="menu-btn" (click)="verificarPedido()">
        <ion-icon name="checkmark-circle-outline"></ion-icon>
        <span>Verificar Pedido</span>
      </button>

      <button class="menu-btn" (click)="entregarPedido()">
        <ion-icon name="bicycle-outline"></ion-icon>
        <span>Entregar Pedido</span>
      </button>

    </div>
  </div>
</div>
