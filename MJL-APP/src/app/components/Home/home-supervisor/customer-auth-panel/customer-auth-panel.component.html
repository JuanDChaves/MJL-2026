<ion-card>
  <ion-card-header>
    <ion-card-title>Panel de autorizacion de clientes</ion-card-title>
    <ion-card-subtitle>Registros pendientes de autorizacion</ion-card-subtitle>
  </ion-card-header>
  <ion-card-content>
    <ion-list>
      <ion-item>
        <ion-thumbnail slot="start">
          <img alt="Silhouette of mountains" src="https://ionicframework.com/docs/img/demos/thumbnail.svg" />
        </ion-thumbnail>
        <ion-label>
          <ion-text color="medium">John Doe</ion-text>
        </ion-label>
        <ion-label>
          <ion-text color="medium">Castillo</ion-text>
        </ion-label>
        <ion-label>
          <ion-text color="medium">123456789</ion-text>
        </ion-label>
        <ion-label>
          <ion-text color="medium">8vH9o@example.com</ion-text>
        </ion-label>
        <ion-button fill="outline" slot="end">Aprobar</ion-button>
        <ion-button fill="outline" slot="end">Rechazar</ion-button>
      </ion-item>
      
    </ion-list>
  </ion-card-content>
</ion-card>
