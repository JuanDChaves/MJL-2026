<app-layout [title]="'Juegos'" [showBackButton]="true" [backUrl]="backUrl">
  <div class="content-inner">

    <header class="juegos-header">
      <span class="kicker">JUGÁ Y GANÁ</span>
      <h1 class="display-title">
        Desafíos<br />
        del <span class="accent">bar</span>
      </h1>
      <p class="lead">
        Sumá puntos en cada partida y canjealos por descuentos
        en tu próxima consumición.
      </p>
      <div class="header-divider"></div>
    </header>

    <swiper-container
      slides-per-view="1"
      space-between="0"
      pagination="true"
      pagination-clickable="true"
      class="full-swiper"
    >
      @for (game of games; track game.name; let i = $index) {
        <swiper-slide class="game-slide">
          <div class="game-card" [style.--anim-delay]="i * 0.12 + 's'">

            <div class="game-image-wrap">
              <img
                class="game-image"
                [src]="game.url"
                [alt]="game.name"
                loading="lazy"
              />
              <span class="game-tag">{{ game.category }}</span>
              <div class="game-image-overlay"></div>
            </div>

            <div class="game-body">
              <h2 class="game-name">{{ game.name }}</h2>
              <p class="game-desc">{{ game.description }}</p>

              <ion-button
                [disabled]="game.disabled"
                [routerLink]="game.disabled ? null : game.route"
                class="play-btn"
                expand="block"
              >
                <ion-icon name="play-outline" slot="start"></ion-icon>
                JUGAR
              </ion-button>
            </div>

          </div>
        </swiper-slide>
      }
    </swiper-container>
  </div>
</app-layout>
