<app-layout [title]="'Inicio'" [showBackButton]="false">
  @if(this.userServ.userData()?.perfil === "mozo"){
    <app-mozo-home-page></app-mozo-home-page>
  } @else if(userServ.userData()?.perfil === 'cocinero') {
     <app-home-cocinero></app-home-cocinero> 
  }@else if (userServ.userData()?.perfil === 'supervisor') {
    <app-home-supervisor></app-home-supervisor>
  } @else{
    <app-home-cantinero></app-home-cantinero>
  }
</app-layout>
