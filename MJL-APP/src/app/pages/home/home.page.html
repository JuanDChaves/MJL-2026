<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title> Blank </ion-title>
    @if (userServ.isLogged()) {
    <ion-buttons slot="end">
      @if (userServ.userData()?.perfil === 'duenio' ||
      userServ.userData()?.perfil === 'supervisor' ||
      userServ.userData()?.perfil === 'metre' ) {
      <ion-button [routerLink]="['/register']" color="warning">
        Registrar
      </ion-button>
      }
      <ion-button (click)="closeSession()">
        <ion-icon name="power-sharp"></ion-icon>
      </ion-button>
    </ion-buttons>
    }@else {
    <ion-buttons slot="end">
      <ion-button (click)="backToLogin()">
        <ion-icon name="person-circle"></ion-icon>
      </ion-button>
    </ion-buttons>
    }
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Usuario</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="container">
    <app-home-supervisor></app-home-supervisor>
  </div>
</ion-content>
